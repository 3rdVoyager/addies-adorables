media:
  - name: adorable_images
    label: Adorable images
    input: public/images/adorables
    output: /images/adorables

content:
  - name: adorables
    label: Adorables
    type: file
    path: src/content/pages/adorables.md
    fields:
      - name: pageTitle
        label: Page title
        type: string
        required: true
      - name: heroTitle
        label: Hero title
        type: string
        required: true
      - name: subTitle
        label: Subtitle
        type: text
      - name: body
        label: Content
        type: rich-text
        options:
          format: markdown

  - name: header
    label: Header
    type: file
    path: src/data/header.json
    fields:
      - name: brand
        label: Brand
        type: object
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: mark
            label: Brand mark
            type: string
            required: true
            description: A short symbol displayed beside the brand name.
      - name: navigation
        label: Navigation
        type: object
        fields:
          - name: navLinks
            label: Navigation links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.label}"
            fields:
              - name: label
                label: Label
                type: string
                required: true
              - name: href
                label: Link
                type: string
                required: true
          - name: ctaLinks
            label: Call-to-action links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.label}"
            fields:
              - name: label
                label: Label
                type: string
                required: true
              - name: href
                label: Link
                type: string
                required: true
