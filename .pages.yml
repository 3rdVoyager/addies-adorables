media:
  - name: images
    label: Images
    input: public/assets/uploads/images
    output: /assets/uploads/images
    categories: [image]
  - name: brand
    label: Brand assets
    input: public/assets/brand
    output: /assets/brand
    categories: [image]

content:
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    subfolders: true
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title]
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: description
        label: Page description
        type: text
        required: true
      - name: standalone
        label: Standalone page
        type: boolean
        default: false
        description: When enabled, the header shows only the brand (no navigation or CTAs).
      - name: body
        label: Page content
        type: rich-text
        options:
          format: html
          media: images
          path: images
          switcher: true

  - name: header
    label: Header
    type: file
    path: src/data/header.json
    fields:
      - name: brand
        label: Brand
        type: object
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: mark
            label: Brand mark
            type: string
            required: true
            description: A short symbol displayed beside the brand name.
      - name: navigation
        label: Navigation
        type: object
        fields:
          - name: navLinks
            label: Navigation links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.label}"
            fields:
              - name: label
                label: Label
                type: string
                required: true
              - name: href
                label: Link
                type: string
                required: true
          - name: ctaLinks
            label: Call-to-action links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.label}"
            fields:
              - name: label
                label: Label
                type: string
                required: true
              - name: href
                label: Link
                type: string
                required: true
