media:
  - name: images
    label: Images
    input: public/assets/uploads/images
    output: /assets/uploads/images
    categories: [image]
    extensions: [webp]
  - name: documents
    label: Documents
    input: public/assets/uploads/documents
    output: /assets/uploads/documents
    categories: [document]
    extensions: [pdf]
  - name: brand
    label: Brand assets
    input: public/assets/brand
    output: /assets/brand
    categories: [image]
    extensions: [png, svg, ico, webp]

components:
  button:
    type: object
    label: Button
    fields:
      - name: title
        label: Text
        type: string
        required: true
      - name: href
        label: Link
        type: string
        required: true
      - name: type
        label: Style
        type: select
        default: primary
        options:
          values: [primary, secondary]

  gallery:
    type: object
    label: Gallery
    fields:
      - name: images
        label: Gallery images
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Image {index}"
        fields:
          - name: src
            label: Image file
            type: image
            required: true
            options:
              media: images
          - name: alt
            label: Accessibility text
            type: string
      - name: size
        label: Gallery width
        type: select
        default: large
        options:
          values: [small, medium, large, full]
        description: Controls the gallery's maximum width.
      - name: crop
        label: Image crop
        type: select
        default: natural
        options:
          values: [natural, landscape, square, portrait]
        description: Natural shows each image without cropping.
      - name: controls
        label: Show arrow controls
        type: boolean
        default: true
      - name: indicators
        label: Show slide indicators
        type: boolean
        default: true
      - name: autoScroll
        label: Auto-scroll
        type: boolean
        default: false
      - name: autoScrollInterval
        label: Auto-scroll interval
        type: number
        default: 5000
        description: Time between slides in milliseconds.
      - name: pauseOnHover
        label: Pause on hover
        type: boolean
        default: true

  image:
    type: object
    label: Image
    fields:
      - name: src
        label: Image file
        type: image
        required: true
        options:
          media: images
      - name: alt
        label: Accessibility text
        type: string
      - name: size
        label: Display size
        type: select
        default: medium
        options:
          values: [small, medium, large, full]
      - name: crop
        label: Crop
        type: select
        default: natural
        options:
          values: [natural, landscape, square, portrait]

  text:
    type: object
    label: Text
    fields:
      - name: text
        label: Text
        type: rich-text
        required: true

  contentblock:
    type: object
    label: Content block
    fields:
      - name: color
        label: Block color
        type: select
        default: transparent
        options:
          values: [navy, cream, white, transparent]
      - name: variant
        label: Block variant
        type: select
        default: default
        options:
          values: [default, card]
      - name: blocks
        label: Nested blocks
        type: block
        list:
          collapsible:
            collapsed: true
            summary: "Nested block {index}"
        blockKey: type
        blocks:
          - name: text
            label: Text block
            component: text
          - name: image
            label: Image block
            component: image
          - name: button
            label: Button block
            fields:
              - name: button
                component: button
          - name: gallery
            label: Gallery block
            fields:
              - name: gallery
                component: gallery

  section:
    type: object
    label: Section
    fields:
      - name: color
        label: Section color
        type: select
        required: true
        default: cream
        options:
          values: [navy, cream, white, home-hero]
      - name: heading
        label: Section heading
        type: string
      - name: layout
        label: Layout
        type: select
        default: auto
        options:
          values: [auto, 1col, 2cols, 3cols, 4cols, 5cols]
      - name: blocks
        label: Content blocks
        type: block
        list:
          collapsible:
            collapsed: true
            summary: "Block {index}"
        blockKey: type
        blocks:
          - name: text
            label: Text block
            component: text
          - name: image
            label: Image block
            fields:
              - name: image
                component: image
          - name: button
            label: Button block
            fields:
              - name: button
                component: button
          - name: block
            label: Nested card block
            fields:
              - name: block
                component: contentblock
          - name: gallery
            label: Gallery block
            fields:
              - name: gallery
                component: gallery

content:
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    subfolders: true
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: title
      fields: [title]
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: sections
        label: Page sections
        component: section
        list:
          collapsible:
            collapsed: true
            summary: "{fields.color} section"

  - name: header
    label: Header
    type: file
    path: src/data/header.json
    fields:
      - name: brand
        label: Brand
        type: object
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: mark
            label: Brand mark
            type: string
            required: true
            description: A short symbol displayed beside the brand name.
      - name: navigation
        label: Navigation
        type: object
        fields:
          - name: navLinks
            label: Navigation links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.label}"
            fields:
              - name: label
                label: Label
                type: string
                required: true
              - name: href
                label: Link
                type: string
                required: true
          - name: ctaLinks
            label: Call-to-action links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.label}"
            fields:
              - name: label
                label: Label
                type: string
                required: true
              - name: href
                label: Link
                type: string
                required: true
