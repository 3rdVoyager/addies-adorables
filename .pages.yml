media:
  - name: images
    label: Images
    input: public/assets/uploads/images
    output: /assets/uploads/images
    categories: [image]
  - name: brand
    label: Brand assets
    input: public/assets/brand
    output: /assets/brand
    categories: [image]

components:
  text:
    type: object
    label: Text
    fields:
      - name: text
        label: Text
        type: rich-text
        required: true
        options:
          media: images
          path: images
          switcher: true

  image:
    type: object
    label: Image
    fields:
      - name: src
        label: Image file
        type: image
        required: true
        options:
          media: images
      - name: alt
        label: Accessibility text
        type: string
      - name: size
        label: Display size
        type: select
        default: medium
        options:
          values: [small, medium, large, full]
      - name: crop
        label: Crop
        type: select
        default: natural
        options:
          values: [natural, landscape, square, portrait]

  button:
    type: object
    label: Button
    fields:
      - name: title
        label: Text
        type: string
        required: true
      - name: href
        label: Link
        type: string
        required: true
      - name: variant
        label: Style
        type: select
        default: primary
        options:
          values: [primary, secondary]

  gallery:
    type: object
    label: Gallery
    fields:
      - name: images
        label: Gallery images
        type: image
        options:
          media: images
          multiple:
            max: 500
          unique: true
      - name: size
        label: Gallery width
        type: select
        default: large
        options:
          values: [small, medium, large, full]
      - name: crop
        label: Image crop
        type: select
        default: natural
        options:
          values: [natural, landscape, square, portrait]
      - name: controls
        label: Show arrow controls
        type: boolean
        default: true
      - name: indicators
        label: Show slide indicators
        type: boolean
        default: true
      - name: autoScroll
        label: Auto-scroll
        type: boolean
        default: false
      - name: autoScrollInterval
        label: Auto-scroll interval
        type: number
        default: 5000
      - name: pauseOnHover
        label: Pause on hover
        type: boolean
        default: true

  contentblock:
    type: object
    label: Content block
    fields:
      - name: color
        label: Block color
        type: select
        default: transparent
        options:
          values: [navy, cream, white, slate, pink, transparent]
      - name: variant
        label: Block style
        type: select
        default: default
        options:
          values: [default, card]
      - name: layout
        label: Layout
        type: select
        default: 1col
        options:
          values: [auto, 1col, 2cols, 3cols, 4cols, 5cols]
      - name: blocks
        label: Nested content blocks
        type: block
        list:
          collapsible:
            collapsed: true
            summary: "Nested block {index}"
        blockKey: type
        blocks:
          - name: text
            label: Text block
            component: text
          - name: image
            label: Image block
            component: image
          - name: button
            label: Button block
            component: button
          - name: gallery
            label: Gallery block
            component: gallery

  section:
    type: object
    label: Section
    fields:
      - name: color
        label: Section color
        type: select
        required: true
        default: cream
        options:
          values: [navy, cream, white, slate, pink]
      - name: layout
        label: Layout
        type: select
        default: auto
        options:
          values: [auto, 1col, 2cols, 3cols, 4cols, 5cols]
      - name: blocks
        label: Content blocks
        type: block
        list:
          collapsible:
            collapsed: true
            summary: "Block {index}"
        blockKey: type
        blocks:
          - name: text
            label: Text block
            component: text
          - name: image
            label: Image block
            component: image
          - name: button
            label: Button block
            component: button
          - name: gallery
            label: Gallery block
            component: gallery
          - name: block
            label: Nested content block
            component: contentblock

content:
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    subfolders: true
    format: yaml-frontmatter
    filename: "{fields.title}.md"
    view:
      primary: title
      fields: [title]
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: description
        label: Page description
        type: text
      - name: standalone
        label: Standalone page
        type: boolean
        default: false
      - name: sections
        label: Page sections
        component: section
        list:
          collapsible:
            collapsed: true
            summary: "{fields.color} section"

  - name: header
    label: Header
    type: file
    path: src/data/header.json
    fields:
      - name: brand
        label: Brand
        type: object
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: mark
            label: Brand mark
            type: string
            required: true
      - name: navigation
        label: Navigation
        type: object
        fields:
          - name: navLinks
            label: Navigation links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.label}"
            fields:
              - name: label
                label: Label
                type: string
                required: true
              - name: href
                label: Link
                type: string
                required: true
          - name: ctaLinks
            label: Call-to-action links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.label}"
            fields:
              - name: label
                label: Label
                type: string
                required: true
              - name: href
                label: Link
                type: string
                required: true
